<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Объявления{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07pV4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand bg-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'post_list' %}">Объявления</a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                {% if user.is_authenticated %}
                    <a class="btn btn-primary btn-sm" href="{% url 'create_post' %}">Новое объявление</a>
                    <span class="text-dark">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-secondary btn-sm">Выйти</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">Войти</a>
                    <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Зарегистрироваться</a>
                {% endif %}
            </div>
        </div>
    </nav>
{% block content %}
{% endblock %}
</body>
</html>
